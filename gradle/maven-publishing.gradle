mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    // AGP's withJavadocJar() uses a bundled Dokka that cannot read Java 17
    // sealed classes (PermittedSubclasses requires ASM9). Use Dokka 2 instead.
    configureBasedOnAppliedPlugins(true, false)
}

def dokkaJavadocJar = tasks.register("dokkaJavadocJar", Jar) {
    description = "Packages Dokka HTML into a javadoc jar for Maven Central"
    from(tasks.named("dokkaGeneratePublicationHtml"))
    archiveClassifier.set("javadoc")
}

afterEvaluate {
    publishing.publications.withType(MavenPublication).configureEach {
        artifact(dokkaJavadocJar)
    }
}

// Payment Sheet, Payment Element, Google Pay and Core share LIBRARY_GROUP APIs.
// Each artifact pins its siblings to its own version so Gradle upgrades them together.
def xmoneyArtifacts = ["payments-core", "paymentelement", "paymentsheet", "googlepay"]
dependencies {
    constraints {
        xmoneyArtifacts.findAll { it != property("POM_ARTIFACT_ID") }.each { artifact ->
            api("${property("GROUP")}:${artifact}:${property("VERSION_NAME")}") {
                because("xMoney SDK artifacts share internal APIs and must use one version")
            }
        }
    }
}
